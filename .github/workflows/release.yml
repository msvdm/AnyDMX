# Build the downloadable app for Windows and Linux, and publish it.
#
# Triggered by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# PyInstaller cannot cross-compile, so each binary is built on the OS it runs
# on — that is the whole reason this is a matrix and not a single job.
#
# Two guards before anything is built: the tag has to match __version__ in
# src/__init__.py, and the test suite has to pass on the platform being built.
# A mislabelled or red binary must never reach a release page, because that is
# the one place a stranger meets this project.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # needed to create the release and upload to it

jobs:
  check-version:
    name: tag matches __version__
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with the version in the source
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/__init__.py').read_text()).group(1))")
          echo "tag=$TAG  source=$SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($SRC) in src/__init__.py"
            exit 1
          fi

  build:
    name: build ${{ matrix.label }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest on purpose: a PyInstaller binary needs the
          # glibc it was built against or newer, so building on the oldest
          # supported runner is what lets it run on the widest range of distros.
          - os: ubuntu-22.04
            label: linux-x64
            artifact: AnyDMX
          - os: windows-latest
            label: windows-x64
            artifact: AnyDMX.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
                                  libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
                                  libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      # Never build a release from a red tree.
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm --clean AnyDMX.spec

      # Prove the thing that was just built is not dead on arrival. It cannot
      # be driven without a screen, but --version unpacks the bundle, starts
      # the interpreter inside it and prints what it is — which also confirms
      # the binary on the release page carries the version on the label.
      - name: Smoke-test the binary
        shell: bash
        run: |
          OUT=$(dist/${{ matrix.artifact }} --version)
          echo "binary reports: $OUT"
          if [ "$OUT" != "AnyDMX ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Expected 'AnyDMX ${GITHUB_REF_NAME#v}', got '$OUT'"
            exit 1
          fi

      - name: Name it after the release
        shell: bash
        run: |
          mkdir -p out
          NAME="AnyDMX-${GITHUB_REF_NAME}-${{ matrix.label }}"
          if [ "${{ runner.os }}" = "Windows" ]; then NAME="$NAME.exe"; fi
          cp "dist/${{ matrix.artifact }}" "out/$NAME"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Collect the binaries
        run: |
          mkdir -p release
          find downloads -type f -exec cp {} release/ \;
          ls -la release/

      # gh is preinstalled on the runner. Used in preference to a third-party
      # action so that publishing depends on nothing outside GitHub itself.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Download the file for your system, and run it. Nothing to install.

          | System | File | How to run it |
          |---|---|---|
          | Windows 10/11 (64-bit) | `AnyDMX-*-windows-x64.exe` | Double-click it |
          | Linux (64-bit, glibc 2.35+) | `AnyDMX-*-linux-x64` | `chmod +x AnyDMX-*-linux-x64` then run it |

          ### Windows will warn you about this file

          It is not signed. A code-signing certificate costs more per year than
          this project costs to run, so SmartScreen shows **"Windows protected
          your PC"** the first time. Click *More info* then *Run anyway*. Some
          antivirus tools flag single-file Python apps for the same reason —
          they are self-extracting, which looks like what it is. The source for
          exactly what you are running is in this repository, and the binary is
          built by GitHub Actions from the tagged commit, not on my machine.

          ### On Linux, the dongle needs a group

          `sudo usermod -aG dialout $USER`, then log out and back in. Without it
          AnyDMX cannot open `/dev/ttyUSB0` — it will tell you so in the status
          line rather than failing silently.

          ### What has actually been tested

          Being specific on purpose, because "it works" is not a useful claim:

          - **Windows + dot2 + FTDI dongle** — the full chain, driving real
            fixtures at 33-35 fps. This is the path the app was built for.
          - **Linux (Mint 22.3)** — Art-Net capture, universe discovery, the
            NetworkManager interface editor, the GUI. **DMX output over a dongle
            is untested on Linux** — the code is there, nobody has watched it
            drive a fixture.
          - **macOS** — not supported, no Apple hardware to test on.

          If it fails on your console or your dongle, that is the most useful
          thing this project can receive: open an issue and say what the status
          line reported.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "AnyDMX $GITHUB_REF_NAME" \
            --notes-file notes.md \
            release/*
